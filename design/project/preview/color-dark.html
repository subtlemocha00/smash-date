<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--fg);padding:22px 24px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:46px;border-radius:8px;border:1px solid var(--border);}
  .name{font-size:11.5px;font-weight:600;color:var(--fg);}
  .badges{display:flex;flex-wrap:wrap;gap:8px;}
  .badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#161d1e;"></div><span class="name">bg</span></div>
    <div class="sw"><div class="chip" style="background:#1f2829;"></div><span class="name">surface</span></div>
    <div class="sw"><div class="chip" style="background:#283233;"></div><span class="name">surface-2</span></div>
    <div class="sw"><div class="chip" style="background:#ff715b;"></div><span class="name">coral</span></div>
  </div>
  <div class="badges">
    <span class="badge" style="background:var(--st-proposed-bg);color:var(--st-proposed-fg);">Proposed</span>
    <span class="badge" style="background:var(--st-changes-bg);color:var(--st-changes-fg);">Changes</span>
    <span class="badge" style="background:var(--st-confirmed-bg);color:var(--st-confirmed-fg);">Confirmed</span>
    <span class="badge" style="background:var(--st-declined-bg);color:var(--st-declined-fg);">Declined</span>
  </div>
</body>
</html>
