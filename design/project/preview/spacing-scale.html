<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:22px 26px;}
  .row{display:flex;align-items:center;gap:14px;padding:5px 0;}
  .bar{height:14px;background:var(--coral);border-radius:3px;}
  .tok{width:34px;font-size:12px;font-weight:600;}
  .val{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);width:48px;}
</style>
</head>
<body>
  <div class="row"><span class="tok">1</span><div class="bar" style="width:4px;"></div><span class="val">4px</span></div>
  <div class="row"><span class="tok">2</span><div class="bar" style="width:8px;"></div><span class="val">8px</span></div>
  <div class="row"><span class="tok">3</span><div class="bar" style="width:12px;"></div><span class="val">12px</span></div>
  <div class="row"><span class="tok">4</span><div class="bar" style="width:16px;"></div><span class="val">16px</span></div>
  <div class="row"><span class="tok">5</span><div class="bar" style="width:20px;"></div><span class="val">20px</span></div>
  <div class="row"><span class="tok">6</span><div class="bar" style="width:24px;"></div><span class="val">24px</span></div>
  <div class="row"><span class="tok">8</span><div class="bar" style="width:32px;"></div><span class="val">32px</span></div>
  <div class="row"><span class="tok">10</span><div class="bar" style="width:40px;"></div><span class="val">40px</span></div>
</body>
</html>
