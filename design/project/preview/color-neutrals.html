<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:22px 24px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .sw{display:flex;flex-direction:column;gap:7px;}
  .chip{height:58px;border-radius:8px;border:1px solid var(--border);}
  .name{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-subtle);}
  .txtrow{display:flex;gap:18px;margin-top:18px;align-items:center;}
  .txt{display:flex;flex-direction:column;}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#f3f6f6;"></div><span class="name">bg</span><span class="hex">#F3F6F6</span></div>
    <div class="sw"><div class="chip" style="background:#ffffff;"></div><span class="name">surface</span><span class="hex">#FFFFFF</span></div>
    <div class="sw"><div class="chip" style="background:#eaeeee;"></div><span class="name">surface-2</span><span class="hex">#EAEEEE</span></div>
    <div class="sw"><div class="chip" style="background:#dde3e3;"></div><span class="name">border</span><span class="hex">#DDE3E3</span></div>
  </div>
  <div class="txtrow">
    <span class="txt"><span style="font-size:19px;font-weight:700;color:#1b2425;">Aa</span><span class="hex">fg #1B2425</span></span>
    <span class="txt"><span style="font-size:19px;font-weight:600;color:#5b6a6b;">Aa</span><span class="hex">fg-muted #5B6A6B</span></span>
    <span class="txt"><span style="font-size:19px;font-weight:500;color:#8a9899;">Aa</span><span class="hex">fg-subtle #8A9899</span></span>
    <span class="txt"><span style="font-size:19px;font-weight:500;color:#b3bebe;">Aa</span><span class="hex">fg-faint #B3BEBE</span></span>
  </div>
</body>
</html>
