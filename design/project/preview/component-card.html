<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--fg);padding:22px 26px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:20px 22px;max-width:420px;}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .title{font-family:var(--font-body);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .badge{font-size:11px;font-weight:600;background:var(--coral);color:#fff;padding:2px 7px;border-radius:999px;}
  .new{font-size:13px;font-weight:500;background:var(--primary);color:var(--on-primary);border:none;border-radius:6px;padding:5px 11px;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #f0f0f0;}
  .row:first-of-type{border-top:none;}
  .lbl{font-size:14px;font-weight:500;}
  .st{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--st-proposed-bg);color:var(--st-proposed-fg);}
</style>
</head>
<body>
  <div class="card">
    <div class="head"><span class="title">Proposals <span class="badge">2</span></span><button class="new">+ New</button></div>
    <div class="row"><span class="lbl">Anniversary dinner</span><span class="st">Proposed</span></div>
    <div class="row"><span class="lbl">Sunday hike</span><span class="st" style="background:var(--st-confirmed-bg);color:var(--st-confirmed-fg);">Confirmed</span></div>
  </div>
</body>
</html>
