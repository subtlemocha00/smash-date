<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:22px 26px;}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--border);padding:11px 0;}
  .row:last-child{border-bottom:none;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);width:120px;flex-shrink:0;}
  .spec{font-family:var(--font-display);color:var(--fg);letter-spacing:var(--tracking-tight);line-height:1.05;}
</style>
</head>
<body>
  <div class="row"><span class="meta">40 / 700</span><span class="spec" style="font-size:40px;font-weight:700;">Propose a date</span></div>
  <div class="row"><span class="meta">28 / 700</span><span class="spec" style="font-size:28px;font-weight:700;">Anniversary dinner</span></div>
  <div class="row"><span class="meta">22 / 600</span><span class="spec" style="font-size:22px;font-weight:600;">Needs Attention</span></div>
  <div class="row"><span class="meta">18 / 600</span><span class="spec" style="font-size:18px;font-weight:600;">Saturday at the pier</span></div>
</body>
</html>
