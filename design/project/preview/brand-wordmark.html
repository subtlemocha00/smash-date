<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    html,
    body {
      margin: 0;
    }

    body {
      font-family: var(--font-display);
      background: var(--surface);
      color: var(--fg);
      padding: 26px;
      display: flex;
      align-items: center;
      gap: 34px;
      flex-wrap: wrap;
    }

    .wm {
      font-weight: 700;
      letter-spacing: var(--tracking-tight);
      font-size: 40px;
      display: inline-flex;
      align-items: baseline;
      gap: 0.14em;
    }

    .wm .date {
      color: var(--coral);
    }

    .wm .smash {
      color: var(--granite);
    }

    .wm .dot {
      color: var(--coral);
    }

    .lockup {
      display: inline-flex;
      align-items: center;
      gap: 11px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--coral);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 27px;
      color: #fff;
    }

    .name {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: var(--tracking-tight);
    }
  </style>
</head>

<body>
  <span class="wm"><span class="date">Smash</span><span class="smash">Date</span><span class="dot">.</span></span>
  <span class="lockup"><span class="mark">SD</span><span class="name">Smash Date</span></span>
</body>

</html>
