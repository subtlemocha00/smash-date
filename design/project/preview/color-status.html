<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:22px 24px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
  .badge{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:6px;}
</style>
</head>
<body>
  <span class="badge" style="background:var(--st-draft-bg);color:var(--st-draft-fg);">Draft</span>
  <span class="badge" style="background:var(--st-proposed-bg);color:var(--st-proposed-fg);">Proposed</span>
  <span class="badge" style="background:var(--st-changes-bg);color:var(--st-changes-fg);">Changes Requested</span>
  <span class="badge" style="background:var(--st-accepted-bg);color:var(--st-accepted-fg);">Accepted</span>
  <span class="badge" style="background:var(--st-confirmed-bg);color:var(--st-confirmed-fg);">Confirmed</span>
  <span class="badge" style="background:var(--st-completed-bg);color:var(--st-completed-fg);">Completed</span>
  <span class="badge" style="background:var(--st-declined-bg);color:var(--st-declined-fg);">Declined</span>
</body>
</html>
