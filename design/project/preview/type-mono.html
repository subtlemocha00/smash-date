<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:24px 26px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;}
  .block{display:flex;flex-direction:column;gap:8px;}
  .cap{font-size:11px;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg-subtle);}
  .code{font-family:var(--font-mono);letter-spacing:var(--tracking-code);color:var(--fg);}
  .chip{display:inline-flex;font-family:var(--font-mono);font-size:18px;font-weight:500;letter-spacing:var(--tracking-code);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--fg);}
</style>
</head>
<body>
  <div class="block">
    <span class="cap">Invite code</span>
    <span class="chip">3F9K2A</span>
  </div>
  <div class="block">
    <span class="cap">Meta / numerals</span>
    <span class="code" style="font-size:15px;">Mar 4 · 7:30 PM · $120</span>
  </div>
  <div class="block">
    <span class="cap">DM Mono 400 / 500</span>
    <span class="code" style="font-size:14px;">0123456789 — abcDEF</span>
  </div>
</body>
</html>
