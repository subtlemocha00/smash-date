<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{font-family:var(--font-body);background:var(--surface);color:var(--fg);padding:22px 26px;}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--border);padding:9px 0;}
  .row:last-child{border-bottom:none;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);width:128px;flex-shrink:0;}
  .spec{font-family:var(--font-body);color:var(--fg);}
</style>
</head>
<body>
  <div class="row"><span class="meta">16 / 600 · md</span><span class="spec" style="font-size:16px;font-weight:600;">Proposals</span></div>
  <div class="row"><span class="meta">14 / 500 · base</span><span class="spec" style="font-size:14px;font-weight:500;">Dinner at Lucia's, then a walk along the harbor</span></div>
  <div class="row"><span class="meta">14 / 400 · base</span><span class="spec" style="font-size:14px;font-weight:400;color:var(--fg-muted);">Alex created a new proposal and assigned you a task.</span></div>
  <div class="row"><span class="meta">13 / 500 · sm</span><span class="spec" style="font-size:13px;font-weight:500;color:var(--fg-muted);">Restaurant / Location</span></div>
  <div class="row"><span class="meta">12 / 400 · xs</span><span class="spec" style="font-size:12px;font-weight:400;color:var(--fg-subtle);">Updated Mar 4 · Awaiting confirmation</span></div>
  <div class="row"><span class="meta">11 / 600 · 2xs</span><span class="spec" style="font-size:11px;font-weight:600;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--fg-subtle);">Eyebrow Label</span></div>
</body>
</html>
